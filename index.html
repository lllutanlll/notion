<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>カナメストーンのカナメちゃん村</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;

  background: #ffffff;
  color: #222222;
}

.player {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
}

.title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}

.subtitle {
  font-size: 12px;
  color: #888888;
  margin-bottom: 16px;
}

audio {
  width: 100%;
  margin-bottom: 14px;
}

.now-playing {
  padding: 12px;
  margin-bottom: 12px;

  background: #f5f5f5;
  border-radius: 8px;
}

.now-playing-label {
  margin-bottom: 4px;

  font-size: 11px;
  color: #888888;
}

.now-playing-title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.5;
}

.controls {
  display: flex;
  gap: 8px;

  margin-bottom: 16px;
}

button {
  appearance: none;

  border: 1px solid #dddddd;
  background: #ffffff;

  color: #222222;

  border-radius: 6px;

  padding: 8px 12px;

  font-size: 13px;

  cursor: pointer;
}

button:hover {
  background: #f5f5f5;
}

button:disabled {
  opacity: 0.4;
  cursor: default;
}

.search {
  width: 100%;

  padding: 9px 11px;

  border:
    1px solid #dddddd;

  border-radius: 6px;

  font-size: 13px;

  margin-bottom: 12px;

  outline: none;
}

.episode-count {
  font-size: 12px;
  color: #888888;

  margin-bottom: 8px;
}

.episodes {
  border-top:
    1px solid #eeeeee;
}

.episode {
  padding: 11px 8px;

  border-bottom:
    1px solid #eeeeee;

  cursor: pointer;
}

.episode:hover {
  background: #f7f7f7;
}

.episode.active {
  background: #f0f0f0;
}

.episode-number {
  font-size: 11px;
  color: #999999;

  margin-bottom: 2px;
}

.episode-title {
  font-size: 13px;

  line-height: 1.5;
}

.episode-date {
  font-size: 11px;
  color: #999999;

  margin-top: 3px;
}

.loading {
  padding: 20px 0;

  text-align: center;

  color: #888888;

  font-size: 13px;
}

.error {
  padding: 14px;

  background: #fff3f3;

  color: #b00020;

  border-radius: 6px;

  font-size: 13px;

  line-height: 1.6;
}

.pagination {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 12px;

  margin-top: 16px;
}

.page-info {
  font-size: 12px;

  color: #888888;
}

</style>

</head>

<body>

<div class="player">

  <div class="title">
    カナメストーンのカナメちゃん村
  </div>

  <div class="subtitle">
    古いエピソード順
  </div>

  <audio
    id="audio"
    controls
    preload="metadata"
  ></audio>

  <div class="now-playing">

    <div class="now-playing-label">
      NOW PLAYING
    </div>

    <div
      id="nowPlaying"
      class="now-playing-title"
    >
      読み込み中……
    </div>

  </div>

  <div class="controls">

    <button id="prevButton">
      ← 前の回
    </button>

    <button id="nextButton">
      次の回 →
    </button>

  </div>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="エピソードを検索"
  >

  <div
    id="episodeCount"
    class="episode-count"
  ></div>

  <div
    id="episodes"
    class="episodes"
  >

    <div class="loading">
      エピソードを読み込んでいます……
    </div>

  </div>

  <div class="pagination">

    <button id="prevPage">
      ←
    </button>

    <span
      id="pageInfo"
      class="page-info"
    ></span>

    <button id="nextPage">
      →
    </button>

  </div>

</div>


<script>

const RSS_URL =
  "/api/rss";

const PER_PAGE = 20;

let episodes = [];

let filteredEpisodes = [];

let currentIndex = -1;

let currentPage = 1;


const audio =
  document.getElementById(
    "audio"
  );

const nowPlaying =
  document.getElementById(
    "nowPlaying"
  );

const episodesElement =
  document.getElementById(
    "episodes"
  );

const episodeCount =
  document.getElementById(
    "episodeCount"
  );

const search =
  document.getElementById(
    "search"
  );

const prevButton =
  document.getElementById(
    "prevButton"
  );

const nextButton =
  document.getElementById(
    "nextButton"
  );

const prevPage =
  document.getElementById(
    "prevPage"
  );

const nextPage =
  document.getElementById(
    "nextPage"
  );

const pageInfo =
  document.getElementById(
    "pageInfo"
  );


/*
 * RSS取得
 */

async function fetchRSS() {

  const response =
    await fetch(
      RSS_URL,
      {
        cache: "no-store"
      }
    );

  if (!response.ok) {

    throw new Error(
      "RSS取得失敗: " +
      response.status
    );

  }

  return await response.text();

}


/*
 * RSS解析
 */

function parseRSS(
  xmlText
) {

  const parser =
    new DOMParser();

  const xml =
    parser.parseFromString(
      xmlText,
      "application/xml"
    );

  const items =
    Array.from(
      xml.querySelectorAll(
        "item"
      )
    );

  return items
    .map(
      function(item) {

        const title =
          item.querySelector(
            "title"
          );

        const pubDate =
          item.querySelector(
            "pubDate"
          );

        const enclosure =
          item.querySelector(
            "enclosure"
          );

        const episodeElement =
          Array.from(
            item.children
          ).find(
            function(el) {

              return (
                el.localName ===
                "episode"
              );

            }
          );

        return {

          title:
            title
              ? title.textContent.trim()
              : "タイトル不明",

          pubDate:
            pubDate
              ? pubDate.textContent.trim()
              : "",

          audioURL:
            enclosure
              ? enclosure.getAttribute(
                  "url"
                )
              : "",

          episode:
            episodeElement
              ? episodeElement.textContent.trim()
              : ""

        };

      }
    )
    .filter(
      function(item) {

        return item.audioURL;

      }
    );

}


/*
 * 古い順
 */

function sortOldestFirst(
  list
) {

  return list.sort(
    function(a, b) {

      return (
        new Date(
          a.pubDate
        ).getTime()
        -
        new Date(
          b.pubDate
        ).getTime()
      );

    }
  );

}


/*
 * 日付
 */

function formatDate(
  dateString
) {

  const date =
    new Date(
      dateString
    );

  if (
    isNaN(
      date.getTime()
    )
  ) {

    return "";

  }

  return date.toLocaleDateString(
    "ja-JP",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }
  );

}


/*
 * エピソード番号
 */

function getEpisodeLabel(
  episode,
  index
) {

  if (episode.episode) {

    return (
      "第" +
      episode.episode +
      "回"
    );

  }

  return (
    "第" +
    (index + 1) +
    "回"
  );

}


/*
 * エピソード再生
 */

function playEpisode(
  index
) {

  if (
    index < 0 ||
    index >= episodes.length
  ) {

    return;

  }

  const episode =
    episodes[index];

  currentIndex =
    index;

  audio.src =
    episode.audioURL;

  audio.load();

  audio.play().catch(
    function() {}
  );

  nowPlaying.textContent =
    getEpisodeLabel(
      episode,
      index
    )
    +
    "　"
    +
    episode.title;

  localStorage.setItem(
    "kanamePodcastIndex",
    String(index)
  );

  currentPage =
    Math.floor(
      index / PER_PAGE
    ) + 1;

  renderEpisodes();

}


/*
 * 一覧
 */

function renderEpisodes() {

  const start =
    (currentPage - 1)
    * PER_PAGE;

  const end =
    start + PER_PAGE;

  const pageItems =
    filteredEpisodes.slice(
      start,
      end
    );

  episodesElement.innerHTML =
    "";

  if (
    pageItems.length === 0
  ) {

    episodesElement.innerHTML =
      '<div class="loading">' +
      '該当するエピソードがありません' +
      '</div>';

    return;

  }

  pageItems.forEach(
    function(episode) {

      const realIndex =
        episodes.indexOf(
          episode
        );

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "episode"
        +
        (
          realIndex ===
          currentIndex
            ? " active"
            : ""
        );

      const number =
        document.createElement(
          "div"
        );

      number.className =
        "episode-number";

      number.textContent =
        getEpisodeLabel(
          episode,
          realIndex
        );

      const title =
        document.createElement(
          "div"
        );

      title.className =
        "episode-title";

      title.textContent =
        episode.title;

      const date =
        document.createElement(
          "div"
        );

      date.className =
        "episode-date";

      date.textContent =
        formatDate(
          episode.pubDate
        );

      div.appendChild(
        number
      );

      div.appendChild(
        title
      );

      div.appendChild(
        date
      );

      div.addEventListener(
        "click",
        function() {

          playEpisode(
            realIndex
          );

        }
      );

      episodesElement.appendChild(
        div
      );

    }
  );


  const totalPages =
    Math.max(
      1,
      Math.ceil(
        filteredEpisodes.length /
        PER_PAGE
      )
    );


  pageInfo.textContent =
    currentPage
    +
    " / "
    +
    totalPages;


  prevPage.disabled =
    currentPage <= 1;

  nextPage.disabled =
    currentPage >=
    totalPages;

}


/*
 * 検索
 */

search.addEventListener(
  "input",
  function() {

    const keyword =
      search.value
        .trim()
        .toLowerCase();

    if (!keyword) {

      filteredEpisodes =
        episodes.slice();

    } else {

      filteredEpisodes =
        episodes.filter(
          function(episode) {

            return episode.title
              .toLowerCase()
              .includes(
                keyword
              );

          }
        );

    }

    currentPage = 1;

    episodeCount.textContent =
      filteredEpisodes.length
      +
      " エピソード";

    renderEpisodes();

  }
);


/*
 * 前
 */

prevButton.addEventListener(
  "click",
  function() {

    playEpisode(
      currentIndex - 1
    );

  }
);


/*
 * 次
 */

nextButton.addEventListener(
  "click",
  function() {

    playEpisode(
      currentIndex + 1
    );

  }
);


/*
 * 自動再生
 */

audio.addEventListener(
  "ended",
  function() {

    if (
      currentIndex <
      episodes.length - 1
    ) {

      playEpisode(
        currentIndex + 1
      );

    }

  }
);


/*
 * ページ
 */

prevPage.addEventListener(
  "click",
  function() {

    if (
      currentPage > 1
    ) {

      currentPage--;

      renderEpisodes();

    }

  }
);


nextPage.addEventListener(
  "click",
  function() {

    const totalPages =
      Math.ceil(
        filteredEpisodes.length /
        PER_PAGE
      );

    if (
      currentPage <
      totalPages
    ) {

      currentPage++;

      renderEpisodes();

    }

  }
);


/*
 * 初期化
 */

async function init() {

  try {

    const xmlText =
      await fetchRSS();

    episodes =
      parseRSS(
        xmlText
      );

    episodes =
      sortOldestFirst(
        episodes
      );

    filteredEpisodes =
      episodes.slice();

    episodeCount.textContent =
      episodes.length
      +
      " エピソード";


    /*
     * 前回の再生位置
     */

    const savedIndex =
      parseInt(
        localStorage.getItem(
          "kanamePodcastIndex"
        ),
        10
      );


    if (
      !isNaN(savedIndex) &&
      savedIndex >= 0 &&
      savedIndex < episodes.length
    ) {

      currentIndex =
        savedIndex;

      const episode =
        episodes[
          savedIndex
        ];

      audio.src =
        episode.audioURL;

      nowPlaying.textContent =
        getEpisodeLabel(
          episode,
          savedIndex
        )
        +
        "　"
        +
        episode.title;

      currentPage =
        Math.floor(
          savedIndex / PER_PAGE
        ) + 1;

    }


    renderEpisodes();


  } catch(error) {

    console.error(
      error
    );

    episodesElement.innerHTML =
      '<div class="error">' +
      'PodcastのRSSを取得できませんでした。' +
      '<br><br>' +
      error.message +
      '</div>';

    nowPlaying.textContent =
      "読み込みに失敗しました";

  }

}


init();

</script>

</body>
</html>
