<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Podcast</title>


<style>

/* =========================================================
   基本
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {

  background: #ffffff;

  color: #222;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  -webkit-font-smoothing: antialiased;

}


/* =========================================================
   全体
========================================================= */

.player {

  width: 100%;

  max-width: 560px;

  margin: 0 auto;

  padding: 10px 20px 20px;

}


/* =========================================================
   Podcast選択
========================================================= */

.podcast-select {

  display: block;

  width: 100%;

  max-width: 340px;

  margin: 0 auto 28px;

  padding: 6px 25px 6px 4px;

  border: none;

  border-bottom: 1px solid #222;

  border-radius: 0;

  background: #fff;

  color: #222;

  font-size: 13px;

  font-weight: 400;

  text-align: center;

  text-align-last: center;

  outline: none;

  cursor: pointer;

}


/* =========================================================
   現在再生中
========================================================= */

.now-playing {

  text-align: center;

  margin-bottom: 18px;

}


.now-playing-title {

  font-size: 17px;

  line-height: 1.5;

  font-weight: 400;

  letter-spacing: 0.01em;

  word-break: break-word;

}


/* =========================================================
   再生時間
========================================================= */

.time-display {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 5px;

  font-size: 9px;

  color: #999;

}


/* =========================================================
   プログレスバー
========================================================= */

.progress-container {

  width: 100%;

  height: 2px;

  background: #e5e5e5;

  cursor: pointer;

  position: relative;

  margin-bottom: 20px;

}


.progress-bar {

  position: absolute;

  left: 0;

  top: 0;

  height: 100%;

  width: 0%;

  background: #222;

}


/* =========================================================
   メイン操作
========================================================= */

.main-controls {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 28px;

  margin-bottom: 20px;

}


.control-button {

  border: none;

  background: transparent;

  color: #222;

  padding: 0;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;

}


.control-button:hover {

  opacity: 0.55;

}


.skip-button {

  width: 34px;

  height: 34px;

  font-size: 11px;

  position: relative;

}


.skip-button span {

  font-size: 8px;

}


.play-button {

  width: 48px;

  height: 48px;

  border: 1px solid #222;

  border-radius: 50%;

  font-size: 16px;

  padding-left: 2px;

}


.play-button.pause {

  font-size: 14px;

  padding-left: 0;

}


/* =========================================================
   前後の回
========================================================= */

.episode-navigation {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 24px;

}


.nav-button {

  border: none;

  background: transparent;

  color: #777;

  font-size: 10px;

  padding: 4px 0;

  cursor: pointer;

}


.nav-button:hover {

  color: #222;

}


.nav-button:disabled {

  opacity: 0.25;

  cursor: default;

}


/* =========================================================
   フィルター
========================================================= */

.filters {

  display: flex;

  gap: 8px;

  margin-bottom: 14px;

}


.season-select,
.search {

  flex: 1;

  min-width: 0;

  height: 30px;

  border: none;

  border-bottom: 1px solid #ddd;

  border-radius: 0;

  background: transparent;

  color: #444;

  font-size: 10px;

  outline: none;

}


.search {

  padding: 0 4px;

}


.season-select {

  padding: 0 4px;

}


/* =========================================================
   エピソード数
========================================================= */

.episode-count {

  font-size: 9px;

  color: #aaa;

  text-align: right;

  margin-bottom: 5px;

}


/* =========================================================
   エピソード一覧
========================================================= */

.episodes {

  border-top: 1px solid #eee;

}


.episode {

  display: grid;

  grid-template-columns: 1fr auto;

  align-items: center;

  gap: 8px;

  padding: 10px 3px;

  border-bottom: 1px solid #eee;

  cursor: pointer;

  transition: opacity 0.15s;

}


.episode:hover {

  opacity: 0.55;

}


.episode.active {

  font-weight: 500;

}


.episode-title {

  font-size: 11px;

  line-height: 1.45;

}


.episode-date {

  font-size: 8px;

  color: #aaa;

  white-space: nowrap;

}


/* =========================================================
   ページネーション
========================================================= */

.pagination {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 20px;

  margin-top: 15px;

}


.pagination button {

  border: none;

  background: transparent;

  color: #555;

  font-size: 12px;

  cursor: pointer;

  padding: 3px;

}


.pagination button:hover {

  color: #000;

}


.pagination button:disabled {

  opacity: 0.2;

  cursor: default;

}


.page-info {

  font-size: 9px;

  color: #aaa;

}


/* =========================================================
   ローディング
========================================================= */

.loading {

  padding: 20px 0;

  text-align: center;

  color: #aaa;

  font-size: 10px;

}


/* =========================================================
   エラー
========================================================= */

.error {

  padding: 12px;

  color: #b00020;

  font-size: 10px;

  line-height: 1.6;

  text-align: center;

}


/* =========================================================
   モバイル
========================================================= */

@media (max-width: 480px) {

  .player {

    padding:
      6px
      14px
      14px;

  }


  .podcast-select {

    margin-bottom: 24px;

  }


  .now-playing-title {

    font-size: 15px;

  }


  .now-playing {

    margin-bottom: 15px;

  }


  .main-controls {

    gap: 22px;

    margin-bottom: 17px;

  }


  .episode {

    grid-template-columns: 1fr;

    padding: 9px 2px;

  }


  .episode-date {

    margin-top: -3px;

  }

}

</style>

</head>


<body>


<div class="player">


  <!-- =====================================================
       Podcast選択
  ====================================================== -->

  <select
    id="podcastSelect"
    class="podcast-select"
  >

    <option value="kaname">
      カナメストーンのカナメちゃん村
    </option>

    <option value="city">
      カナメストーンのカナメちゃんシティ
    </option>

    <option value="shinku">
      真空ジェシカのラジオ父ちゃん
    </option>

  </select>


  <!-- =====================================================
       現在再生中
  ====================================================== -->

  <div class="now-playing">

    <div
      id="nowPlaying"
      class="now-playing-title"
    >
      読み込み中……
    </div>

  </div>


  <!-- =====================================================
       時間
  ====================================================== -->

  <div class="time-display">

    <span id="currentTime">
      0:00
    </span>

    <span id="duration">
      0:00
    </span>

  </div>


  <!-- =====================================================
       プログレスバー
  ====================================================== -->

  <div
    id="progressContainer"
    class="progress-container"
  >

    <div
      id="progressBar"
      class="progress-bar"
    ></div>

  </div>


  <!-- =====================================================
       音声
  ====================================================== -->

  <audio
    id="audio"
    preload="metadata"
  ></audio>


  <!-- =====================================================
       メイン操作
  ====================================================== -->

  <div class="main-controls">


    <button
      id="back10"
      class="control-button skip-button"
      title="10秒戻る"
    >

      ↶

      <span>
        10
      </span>

    </button>


    <button
      id="playButton"
      class="control-button play-button"
      title="再生"
    >

      ▶

    </button>


    <button
      id="forward10"
      class="control-button skip-button"
      title="10秒進む"
    >

      <span>
        10
      </span>

      ↷

    </button>


  </div>


  <!-- =====================================================
       前後
  ====================================================== -->

  <div class="episode-navigation">


    <button
      id="prevButton"
      class="nav-button"
    >

      ← 前の回

    </button>


    <button
      id="nextButton"
      class="nav-button"
    >

      次の回 →

    </button>


  </div>


  <!-- =====================================================
       フィルター
  ====================================================== -->

  <div class="filters">


    <select
      id="seasonSelect"
      class="season-select"
    >

      <option value="all">
        すべてのシーズン
      </option>

    </select>


    <input
      id="search"
      class="search"
      type="search"
      placeholder="エピソードを検索"
    >


  </div>


  <!-- =====================================================
       エピソード数
  ====================================================== -->

  <div
    id="episodeCount"
    class="episode-count"
  ></div>


  <!-- =====================================================
       エピソード
  ====================================================== -->

  <div
    id="episodes"
    class="episodes"
  >

    <div class="loading">
      エピソードを読み込んでいます……
    </div>

  </div>


  <!-- =====================================================
       ページ
  ====================================================== -->

  <div class="pagination">


    <button id="prevPage">
      ←
    </button>


    <span
      id="pageInfo"
      class="page-info"
    ></span>


    <button id="nextPage">
      →
    </button>


  </div>


</div>


<script>


/* =========================================================
   設定
========================================================= */

const RSS_ENDPOINT =
  "/api/rss";

const PER_PAGE =
  20;


/* =========================================================
   Podcast
========================================================= */

const PODCASTS = {

  kaname: {
    name:
      "カナメストーンのカナメちゃん村"
  },

  city: {
    name:
      "カナメストーンのカナメちゃんシティ"
  },

  shinku: {
    name:
      "真空ジェシカのラジオ父ちゃん"
  }

};


/* =========================================================
   状態
========================================================= */

let episodes = [];

let filteredEpisodes = [];

let currentIndex = -1;

let currentPage = 1;

let selectedSeason = "all";

let currentPodcast = "kaname";


/* =========================================================
   DOM
========================================================= */

const podcastSelect =
  document.getElementById(
    "podcastSelect"
  );

const audio =
  document.getElementById(
    "audio"
  );

const nowPlaying =
  document.getElementById(
    "nowPlaying"
  );

const episodesElement =
  document.getElementById(
    "episodes"
  );

const episodeCount =
  document.getElementById(
    "episodeCount"
  );

const search =
  document.getElementById(
    "search"
  );

const prevButton =
  document.getElementById(
    "prevButton"
  );

const nextButton =
  document.getElementById(
    "nextButton"
  );

const back10 =
  document.getElementById(
    "back10"
  );

const forward10 =
  document.getElementById(
    "forward10"
  );

const playButton =
  document.getElementById(
    "playButton"
  );

const seasonSelect =
  document.getElementById(
    "seasonSelect"
  );

const prevPage =
  document.getElementById(
    "prevPage"
  );

const nextPage =
  document.getElementById(
    "nextPage"
  );

const pageInfo =
  document.getElementById(
    "pageInfo"
  );

const currentTimeElement =
  document.getElementById(
    "currentTime"
  );

const durationElement =
  document.getElementById(
    "duration"
  );

const progressContainer =
  document.getElementById(
    "progressContainer"
  );

const progressBar =
  document.getElementById(
    "progressBar"
  );


/* =========================================================
   保存キー
========================================================= */

function getStorageKey() {

  return (
    "podcastPlayer_" +
    currentPodcast
  );

}


/* =========================================================
   時間表示
========================================================= */

function formatTime(seconds) {

  if (
    !isFinite(seconds)
  ) {

    return "0:00";

  }

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    Math.floor(
      seconds % 60
    );

  return (
    minutes +
    ":" +
    String(secs).padStart(
      2,
      "0"
    )
  );

}


/* =========================================================
   RSS取得
========================================================= */

async function fetchRSS() {

  const response =
    await fetch(

      RSS_ENDPOINT +
      "?podcast=" +
      encodeURIComponent(
        currentPodcast
      ),

      {
        cache: "no-store"
      }

    );

  if (!response.ok) {

    throw new Error(
      "RSS取得失敗: " +
      response.status
    );

  }

  return await response.text();

}


/* =========================================================
   RSS解析
========================================================= */

function parseRSS(xmlText) {

  const parser =
    new DOMParser();

  const xml =
    parser.parseFromString(
      xmlText,
      "application/xml"
    );

  const items =
    Array.from(
      xml.querySelectorAll(
        "item"
      )
    );

  return items

    .map(
      function(item) {

        const titleElement =
          item.querySelector(
            "title"
          );

        const pubDateElement =
          item.querySelector(
            "pubDate"
          );

        const enclosure =
          item.querySelector(
            "enclosure"
          );

        const episodeElement =
          Array.from(
            item.children
          ).find(
            function(el) {

              return (
                el.localName ===
                "episode"
              );

            }
          );

        const seasonElement =
          Array.from(
            item.children
          ).find(
            function(el) {

              return (
                el.localName ===
                "season"
              );

            }
          );

        return {

          title:
            titleElement
              ? titleElement.textContent.trim()
              : "タイトル不明",

          pubDate:
            pubDateElement
              ? pubDateElement.textContent.trim()
              : "",

          audioURL:
            enclosure
              ? enclosure.getAttribute(
                  "url"
                )
              : "",

          episode:
            episodeElement
              ? episodeElement.textContent.trim()
              : "",

          season:
            seasonElement
              ? seasonElement.textContent.trim()
              : ""

        };

      }
    )

    .filter(
      function(item) {

        return item.audioURL;

      }
    );

}


/* =========================================================
   古い順
========================================================= */

function sortOldestFirst(list) {

  return list.sort(
    function(a, b) {

      const dateA =
        new Date(
          a.pubDate
        ).getTime();

      const dateB =
        new Date(
          b.pubDate
        ).getTime();

      return (
        dateA - dateB
      );

    }
  );

}


/* =========================================================
   シーズン
========================================================= */

function createSeasonList() {

  seasonSelect.innerHTML =
    '<option value="all">' +
    'すべてのシーズン' +
    '</option>';

  const seasons = [];

  episodes.forEach(
    function(episode) {

      if (
        episode.season &&
        !seasons.includes(
          episode.season
        )
      ) {

        seasons.push(
          episode.season
        );

      }

    }
  );

  seasons.sort(
    function(a, b) {

      return (
        Number(a) -
        Number(b)
      );

    }
  );

  seasons.forEach(
    function(season) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        season;

      option.textContent =
        "Season " +
        season;

      seasonSelect.appendChild(
        option
      );

    }
  );

}


/* =========================================================
   日付
========================================================= */

function formatDate(dateString) {

  const date =
    new Date(
      dateString
    );

  if (
    isNaN(
      date.getTime()
    )
  ) {

    return "";

  }

  return date.toLocaleDateString(
    "ja-JP",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }
  );

}


/* =========================================================
   再生
========================================================= */

async function playEpisode(
  index
) {

  if (
    index < 0 ||
    index >= episodes.length
  ) {

    return;

  }

  const episode =
    episodes[index];

  currentIndex =
    index;

  audio.src =
    episode.audioURL;

  audio.load();

  nowPlaying.textContent =
    episode.title;

  localStorage.setItem(
    getStorageKey(),
    String(index)
  );

  renderEpisodes();

  try {

    await audio.play();

  } catch (error) {

    console.log(
      "Autoplay blocked"
    );

  }

}


/* =========================================================
   再生ボタン
========================================================= */

playButton.addEventListener(
  "click",
  function() {

    if (
      audio.paused
    ) {

      if (
        !audio.src &&
        episodes.length > 0
      ) {

        playEpisode(
          currentIndex >= 0
            ? currentIndex
            : 0
        );

      } else {

        audio.play();

      }

    } else {

      audio.pause();

    }

  }
);


/* =========================================================
   再生状態
========================================================= */

audio.addEventListener(
  "play",
  function() {

    playButton.textContent =
      "Ⅱ";

    playButton.classList.add(
      "pause"
    );

  }
);


audio.addEventListener(
  "pause",
  function() {

    playButton.textContent =
      "▶";

    playButton.classList.remove(
      "pause"
    );

  }
);


/* =========================================================
   時間更新
========================================================= */

audio.addEventListener(
  "loadedmetadata",
  function() {

    durationElement.textContent =
      formatTime(
        audio.duration
      );

  }
);


audio.addEventListener(
  "timeupdate",
  function() {

    currentTimeElement.textContent =
      formatTime(
        audio.currentTime
      );

    durationElement.textContent =
      formatTime(
        audio.duration
      );

    if (
      audio.duration
    ) {

      const percentage =
        (
          audio.currentTime /
          audio.duration
        ) *
        100;

      progressBar.style.width =
        percentage + "%";

    }

  }
);


/* =========================================================
   プログレスバー
========================================================= */

progressContainer.addEventListener(
  "click",
  function(event) {

    if (
      !audio.duration
    ) {

      return;

    }

    const rect =
      progressContainer.getBoundingClientRect();

    const ratio =
      (
        event.clientX -
        rect.left
      ) /
      rect.width;

    audio.currentTime =
      audio.duration *
      ratio;

  }
);


/* =========================================================
   10秒戻る
========================================================= */

back10.addEventListener(
  "click",
  function() {

    audio.currentTime =
      Math.max(
        0,
        audio.currentTime - 10
      );

  }
);


/* =========================================================
   10秒進む
========================================================= */

forward10.addEventListener(
  "click",
  function() {

    if (
      audio.duration
    ) {

      audio.currentTime =
        Math.min(
          audio.duration,
          audio.currentTime + 10
        );

    }

  }
);


/* =========================================================
   フィルター
========================================================= */

function applyFilters() {

  const keyword =
    search.value
      .trim()
      .toLowerCase();

  filteredEpisodes =
    episodes.filter(
      function(episode) {

        const seasonOK =
          selectedSeason ===
          "all" ||
          episode.season ===
          selectedSeason;

        const searchOK =
          !keyword ||
          episode.title
            .toLowerCase()
            .includes(
              keyword
            );

        return (
          seasonOK &&
          searchOK
        );

      }
    );

  currentPage = 1;

  episodeCount.textContent =
    filteredEpisodes.length +
    " エピソード";

  renderEpisodes();

}


/* =========================================================
   シーズン変更
========================================================= */

seasonSelect.addEventListener(
  "change",
  function() {

    selectedSeason =
      seasonSelect.value;

    applyFilters();

  }
);


/* =========================================================
   検索
========================================================= */

search.addEventListener(
  "input",
  function() {

    applyFilters();

  }
);


/* =========================================================
   エピソード一覧
========================================================= */

function renderEpisodes() {

  const start =
    (currentPage - 1) *
    PER_PAGE;

  const end =
    start +
    PER_PAGE;

  const pageItems =
    filteredEpisodes.slice(
      start,
      end
    );

  episodesElement.innerHTML =
    "";

  if (
    pageItems.length === 0
  ) {

    episodesElement.innerHTML =
      '<div class="loading">' +
      '該当するエピソードがありません' +
      '</div>';

    pageInfo.textContent =
      "";

    return;

  }

  pageItems.forEach(
    function(episode) {

      const realIndex =
        episodes.indexOf(
          episode
        );

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "episode" +
        (
          realIndex ===
          currentIndex
            ? " active"
            : ""
        );

      const episodeTitle =
        document.createElement(
          "div"
        );

      episodeTitle.className =
        "episode-title";

      episodeTitle.textContent =
        episode.title;

      const date =
        document.createElement(
          "div"
        );

      date.className =
        "episode-date";

      date.textContent =
        formatDate(
          episode.pubDate
        );

      div.appendChild(
        episodeTitle
      );

      div.appendChild(
        date
      );

      div.addEventListener(
        "click",
        function() {

          playEpisode(
            realIndex
          );

        }
      );

      episodesElement.appendChild(
        div
      );

    }
  );

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        filteredEpisodes.length /
        PER_PAGE
      )
    );

  pageInfo.textContent =
    currentPage +
    " / " +
    totalPages;

  prevPage.disabled =
    currentPage <= 1;

  nextPage.disabled =
    currentPage >=
    totalPages;

  prevButton.disabled =
    currentIndex <= 0;

  nextButton.disabled =
    currentIndex >=
    episodes.length - 1;

}


/* =========================================================
   前の回
========================================================= */

prevButton.addEventListener(
  "click",
  function() {

    playEpisode(
      currentIndex - 1
    );

  }
);


/* =========================================================
   次の回
========================================================= */

nextButton.addEventListener(
  "click",
  function() {

    playEpisode(
      currentIndex + 1
    );

  }
);


/* =========================================================
   再生終了 → 次の回
========================================================= */

audio.addEventListener(
  "ended",
  function() {

    if (
      currentIndex <
      episodes.length - 1
    ) {

      playEpisode(
        currentIndex + 1
      );

    }

  }
);


/* =========================================================
   前ページ
========================================================= */

prevPage.addEventListener(
  "click",
  function() {

    if (
      currentPage > 1
    ) {

      currentPage--;

      renderEpisodes();

    }

  }
);


/* =========================================================
   次ページ
========================================================= */

nextPage.addEventListener(
  "click",
  function() {

    const totalPages =
      Math.ceil(
        filteredEpisodes.length /
        PER_PAGE
      );

    if (
      currentPage <
      totalPages
    ) {

      currentPage++;

      renderEpisodes();

    }

  }
);


/* =========================================================
   Podcast切り替え
========================================================= */

podcastSelect.addEventListener(
  "change",
  async function() {

    currentPodcast =
      podcastSelect.value;

    localStorage.setItem(
      "selectedPodcast",
      currentPodcast
    );

    episodes = [];

    filteredEpisodes = [];

    currentIndex = -1;

    currentPage = 1;

    selectedSeason = "all";

    search.value = "";

    seasonSelect.innerHTML =
      '<option value="all">' +
      'すべてのシーズン' +
      '</option>';

    episodesElement.innerHTML =
      '<div class="loading">' +
      'エピソードを読み込んでいます……' +
      '</div>';

    episodeCount.textContent =
      "";

    pageInfo.textContent =
      "";

    audio.pause();

    audio.removeAttribute(
      "src"
    );

    audio.load();

    progressBar.style.width =
      "0%";

    currentTimeElement.textContent =
      "0:00";

    durationElement.textContent =
      "0:00";

    nowPlaying.textContent =
      "読み込み中……";

    await loadPodcast();

  }
);


/* =========================================================
   Podcast読み込み
========================================================= */

async function loadPodcast() {

  try {

    const xmlText =
      await fetchRSS();

    episodes =
      parseRSS(
        xmlText
      );

    episodes =
      sortOldestFirst(
        episodes
      );

    createSeasonList();

    filteredEpisodes =
      episodes.slice();

    episodeCount.textContent =
      episodes.length +
      " エピソード";

    const savedIndex =
      parseInt(
        localStorage.getItem(
          getStorageKey()
        ),
        10
      );

    if (
      !isNaN(savedIndex) &&
      savedIndex >= 0 &&
      savedIndex <
        episodes.length
    ) {

      currentIndex =
        savedIndex;

      const episode =
        episodes[
          savedIndex
        ];

      audio.src =
        episode.audioURL;

      nowPlaying.textContent =
        episode.title;

      currentPage =
        Math.floor(
          savedIndex /
          PER_PAGE
        ) + 1;

    } else {

      if (
        episodes.length > 0
      ) {

        const episode =
          episodes[0];

        currentIndex = 0;

        audio.src =
          episode.audioURL;

        nowPlaying.textContent =
          episode.title;

      }

    }

    renderEpisodes();

  } catch(error) {

    console.error(
      error
    );

    episodesElement.innerHTML =
      '<div class="error">' +
      'PodcastのRSSを取得できませんでした。' +
      '<br><br>' +
      error.message +
      '</div>';

    nowPlaying.textContent =
      "読み込みに失敗しました";

  }

}


/* =========================================================
   初期化
========================================================= */

async function init() {

  const savedPodcast =
    localStorage.getItem(
      "selectedPodcast"
    );

  if (
    savedPodcast &&
    PODCASTS[
      savedPodcast
    ]
  ) {

    currentPodcast =
      savedPodcast;

    podcastSelect.value =
      savedPodcast;

  }

  await loadPodcast();

}


init();


</script>

</body>
