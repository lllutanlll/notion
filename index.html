<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Cute Timer</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #a8c9d2;
  color: #ffffff;
  font-family: 'Press Start 2P', cursive;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  height: 100vh;
  overflow: hidden;

  position: relative;
}

#time {
  font-size: 32px;
  margin-bottom: 30px;
  letter-spacing: 2px;
}

button {
  font-family: 'Press Start 2P', cursive;
}

/* START / STOP */
#btn {
  font-size: 14px;
  padding: 12px 24px;

  border: 2px solid #ffffff;
  background: transparent;
  color: #ffffff;

  cursor: pointer;
  transition: transform 0.1s;
}

#btn:active {
  transform: scale(0.9);
  background: #ffffff;
  color: #a8c9d2;
}

/* RESET */
#resetBtn {
  position: absolute;
  bottom: 20px;
  right: 20px;

  font-size: 18px;

  background: transparent;
  border: none;

  color: rgba(255,255,255,0.7);

  cursor: pointer;

  transition:
    transform 0.1s,
    opacity 0.2s;
}

#resetBtn:hover {
  opacity: 1;
}

#resetBtn:active {
  transform: scale(0.8) rotate(-20deg);
}

/* キラキラ */
.sparkle {
  position: absolute;

  width: 6px;
  height: 6px;

  background: white;

  animation: pop 0.6s ease-out forwards;
}

@keyframes pop {
  0% {
    transform: scale(0) translate(0,0);
    opacity: 1;
  }

  100% {
    transform: scale(1.5) translate(var(--x), var(--y));
    opacity: 0;
  }
}
</style>
</head>

<body>

<div id="time">00:00:00</div>

<button id="btn">START</button>

<button id="resetBtn">↻</button>

<script>
let startTime = 0;
let elapsed = 0;
let timer = null;
let running = false;

const btn = document.getElementById("btn");
const resetBtn = document.getElementById("resetBtn");

/* 保存 */
function saveState() {
  localStorage.setItem("timer_running", running);
  localStorage.setItem("timer_startTime", startTime);
  localStorage.setItem("timer_elapsed", elapsed);
}

/* 読み込み */
function loadState() {
  const savedRunning = localStorage.getItem("timer_running");
  const savedStart = localStorage.getItem("timer_startTime");
  const savedElapsed = localStorage.getItem("timer_elapsed");

  if (savedElapsed) {
    elapsed = parseInt(savedElapsed);
  }

  if (savedRunning === "true") {
    running = true;
    startTime = parseInt(savedStart);

    timer = setInterval(update, 1000);

    btn.textContent = "STOP";
  }

  update();
}

/* かわいい音 */
function playBeep() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  function tone(freq, start) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "square";
    osc.frequency.value = freq;

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(start);

    gain.gain.setValueAtTime(0.4, start);
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      start + 0.15
    );

    osc.stop(start + 0.15);
  }

  const now = ctx.currentTime;

  tone(700, now);
  tone(1000, now + 0.08);
}

/* キラキラ */
function sparkle() {
  for (let i = 0; i < 10; i++) {

    const s = document.createElement("div");

    s.className = "sparkle";

    const x =
      (Math.random() - 0.5) * 200 + "px";

    const y =
      (Math.random() - 0.5) * 200 + "px";

    s.style.setProperty('--x', x);
    s.style.setProperty('--y', y);

    s.style.left = "50%";
    s.style.top = "50%";

    document.body.appendChild(s);

    setTimeout(() => s.remove(), 600);
  }
}

/* 更新 */
function update() {

  let diff = elapsed;

  if (running) {
    diff += Date.now() - startTime;
  }

  const h =
    Math.floor(diff / 3600000);

  const m =
    Math.floor(diff / 60000) % 60;

  const s =
    Math.floor(diff / 1000) % 60;

  document.getElementById("time").textContent =
    String(h).padStart(2, '0') + ":" +
    String(m).padStart(2, '0') + ":" +
    String(s).padStart(2, '0');
}

/* START / STOP */
btn.addEventListener("click", () => {

  playBeep();
  sparkle();

  if (!running) {

    startTime = Date.now();

    running = true;

    timer = setInterval(update, 1000);

    btn.textContent = "STOP";

  } else {

    clearInterval(timer);

    elapsed += Date.now() - startTime;

    running = false;

    btn.textContent = "START";
  }

  saveState();
});

/* RESET */
resetBtn.addEventListener("click", () => {

  clearInterval(timer);

  startTime = 0;
  elapsed = 0;
  running = false;

  localStorage.removeItem("timer_running");
  localStorage.removeItem("timer_startTime");
  localStorage.removeItem("timer_elapsed");

  document.getElementById("time").textContent =
    "00:00:00";

  btn.textContent = "START";

  sparkle();
});

/* 起動時 */
loadState();

/* 定期保存 */
setInterval(() => {
  if (running) {
    saveState();
  }
}, 1000);
</script>

</body>
</html>
