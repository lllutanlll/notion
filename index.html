<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Podcast Player</title>


<style>

/* =========================================================
   基本
========================================================= */

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  padding: 20px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;

  background: #ffffff;

  color: #222222;

}


.player {

  width: 100%;

  max-width: 720px;

  margin: 0 auto;

}


/* =========================================================
   Podcast選択
========================================================= */

.podcast-select {

  width: 100%;

  padding: 10px 12px;

  margin-bottom: 12px;

  border: 1px solid #dddddd;

  border-radius: 6px;

  background: #ffffff;

  color: #222222;

  font-size: 14px;

  font-weight: 600;

}


/* =========================================================
   プレイヤー
========================================================= */

.player-controls {

  display: flex;

  align-items: center;

  gap: 5px;

  width: 100%;

  margin-bottom: 12px;

}


audio {

  flex: 1;

  width: auto;

  min-width: 0;

  margin: 0;

}


/* =========================================================
   10秒スキップ
========================================================= */

.skip-controls {

  display: flex;

  align-items: center;

  gap: 1px;

  flex-shrink: 0;

}


.skip-button {

  appearance: none;

  border: none;

  background: transparent;

  color: #777777;

  padding: 3px 4px;

  border-radius: 4px;

  font-size: 11px;

  line-height: 1.4;

  cursor: pointer;

  white-space: nowrap;

}


.skip-button:hover {

  background: #f3f3f3;

  color: #222222;

}


.skip-button:active {

  background: #e8e8e8;

}


/* =========================================================
   現在再生中
========================================================= */

.now-playing {

  padding: 12px;

  margin-bottom: 12px;

  background: #f5f5f5;

  border-radius: 8px;

}


.now-playing-label {

  margin-bottom: 4px;

  font-size: 11px;

  color: #888888;

}


.now-playing-title {

  font-size: 14px;

  font-weight: 600;

  line-height: 1.5;

}


/* =========================================================
   前後のエピソード
========================================================= */

.controls {

  display: flex;

  gap: 8px;

  margin-bottom: 16px;

}


.controls button {

  flex: 1;

  appearance: none;

  border: 1px solid #dddddd;

  background: #ffffff;

  color: #222222;

  border-radius: 6px;

  padding: 8px 12px;

  font-size: 13px;

  cursor: pointer;

}


.controls button:hover {

  background: #f5f5f5;

}


.controls button:disabled {

  opacity: 0.4;

  cursor: default;

}


/* =========================================================
   シーズン選択
========================================================= */

.season-select {

  width: 100%;

  padding: 9px 11px;

  border: 1px solid #dddddd;

  border-radius: 6px;

  font-size: 13px;

  background: #ffffff;

  color: #222222;

  margin-bottom: 12px;

}


/* =========================================================
   検索
========================================================= */

.search {

  width: 100%;

  padding: 9px 11px;

  border: 1px solid #dddddd;

  border-radius: 6px;

  font-size: 13px;

  margin-bottom: 12px;

  outline: none;

}


/* =========================================================
   エピソード数
========================================================= */

.episode-count {

  font-size: 12px;

  color: #888888;

  margin-bottom: 8px;

}


/* =========================================================
   エピソード一覧
========================================================= */

.episodes {

  border-top:
    1px solid #eeeeee;

}


.episode {

  padding: 11px 8px;

  border-bottom:
    1px solid #eeeeee;

  cursor: pointer;

}


.episode:hover {

  background: #f7f7f7;

}


.episode.active {

  background: #f0f0f0;

}


.episode-number {

  font-size: 11px;

  color: #999999;

  margin-bottom: 2px;

}


.episode-title {

  font-size: 13px;

  line-height: 1.5;

}


.episode-date {

  font-size: 11px;

  color: #999999;

  margin-top: 3px;

}


/* =========================================================
   ページネーション
========================================================= */

.pagination {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 12px;

  margin-top: 16px;

}


.pagination button {

  border: 1px solid #dddddd;

  background: #ffffff;

  border-radius: 6px;

  padding: 7px 12px;

  cursor: pointer;

}


.pagination button:hover {

  background: #f5f5f5;

}


.pagination button:disabled {

  opacity: 0.4;

  cursor: default;

}


.page-info {

  font-size: 12px;

  color: #888888;

}


/* =========================================================
   ローディング
========================================================= */

.loading {

  padding: 20px 0;

  text-align: center;

  color: #888888;

  font-size: 13px;

}


/* =========================================================
   エラー
========================================================= */

.error {

  padding: 14px;

  background: #fff3f3;

  color: #b00020;

  border-radius: 6px;

  font-size: 13px;

  line-height: 1.6;

}


/* =========================================================
   スマートフォン
========================================================= */

@media (max-width: 480px) {

  .player-controls {

    gap: 3px;

  }


  .skip-button {

    font-size: 10px;

    padding: 3px 3px;

  }

}

</style>

</head>


<body>


<div class="player">


  <!-- =====================================================
       Podcast選択
  ====================================================== -->

  <select
    id="podcastSelect"
    class="podcast-select"
  >

    <option value="kaname">
      カナメストーンのカナメちゃん村
    </option>

    <option value="city">
      カナメストーンのカナメちゃんシティ
    </option>

    <option value="shinku">
      真空ジェシカのラジオ父ちゃん
    </option>

  </select>


  <!-- =====================================================
       プレイヤー
  ====================================================== -->

  <div class="player-controls">


    <audio
      id="audio"
      controls
      preload="metadata"
    ></audio>


    <!-- 10秒スキップ -->

    <div class="skip-controls">


      <button
        id="back10"
        class="skip-button"
        title="10秒戻る"
      >

        ↶10

      </button>


      <button
        id="forward10"
        class="skip-button"
        title="10秒進む"
      >

        10↷

      </button>


    </div>


  </div>


  <!-- =====================================================
       現在再生中
  ====================================================== -->

  <div class="now-playing">


    <div class="now-playing-label">

      NOW PLAYING

    </div>


    <div
      id="nowPlaying"
      class="now-playing-title"
    >

      読み込み中……

    </div>


  </div>


  <!-- =====================================================
       前後のエピソード
  ====================================================== -->

  <div class="controls">


    <button id="prevButton">

      ← 前の回

    </button>


    <button id="nextButton">

      次の回 →

    </button>


  </div>


  <!-- =====================================================
       シーズン
  ====================================================== -->

  <select
    id="seasonSelect"
    class="season-select"
  >

    <option value="all">

      すべてのシーズン

    </option>

  </select>


  <!-- =====================================================
       検索
  ====================================================== -->

  <input
    id="search"
    class="search"
    type="search"
    placeholder="エピソードを検索"
  >


  <!-- =====================================================
       エピソード数
  ====================================================== -->

  <div
    id="episodeCount"
    class="episode-count"
  ></div>


  <!-- =====================================================
       エピソード一覧
  ====================================================== -->

  <div
    id="episodes"
    class="episodes"
  >

    <div class="loading">

      エピソードを読み込んでいます……

    </div>

  </div>


  <!-- =====================================================
       ページ
  ====================================================== -->

  <div class="pagination">


    <button id="prevPage">

      ←

    </button>


    <span
      id="pageInfo"
      class="page-info"
    ></span>


    <button id="nextPage">

      →

    </button>


  </div>


</div>



<script>


/* =========================================================
   設定
========================================================= */


const RSS_ENDPOINT =
  "/api/rss";


const PER_PAGE =
  20;


/* =========================================================
   Podcast情報
========================================================= */


const PODCASTS = {

  kaname: {

    name:
      "カナメストーンのカナメちゃん村"

  },


  city: {

    name:
      "カナメストーンのカナメちゃんシティ"

  },


  shinku: {

    name:
      "真空ジェシカのラジオ父ちゃん"

  }

};


/* =========================================================
   状態
========================================================= */


let episodes = [];

let filteredEpisodes = [];

let currentIndex = -1;

let currentPage = 1;

let selectedSeason = "all";

let currentPodcast = "kaname";


/* =========================================================
   DOM
========================================================= */


const podcastSelect =
  document.getElementById(
    "podcastSelect"
  );


const audio =
  document.getElementById(
    "audio"
  );


const nowPlaying =
  document.getElementById(
    "nowPlaying"
  );


const episodesElement =
  document.getElementById(
    "episodes"
  );


const episodeCount =
  document.getElementById(
    "episodeCount"
  );


const search =
  document.getElementById(
    "search"
  );


const prevButton =
  document.getElementById(
    "prevButton"
  );


const nextButton =
  document.getElementById(
    "nextButton"
  );


const back10 =
  document.getElementById(
    "back10"
  );


const forward10 =
  document.getElementById(
    "forward10"
  );


const seasonSelect =
  document.getElementById(
    "seasonSelect"
  );


const prevPage =
  document.getElementById(
    "prevPage"
  );


const nextPage =
  document.getElementById(
    "nextPage"
  );


const pageInfo =
  document.getElementById(
    "pageInfo"
  );


/* =========================================================
   Podcastごとの保存キー
========================================================= */


function getStorageKey() {

  return (
    "podcastPlayer_" +
    currentPodcast
  );

}


/* =========================================================
   RSS取得
========================================================= */


async function fetchRSS() {


  const response =
    await fetch(

      RSS_ENDPOINT +

      "?podcast=" +

      encodeURIComponent(
        currentPodcast
      ),

      {
        cache: "no-store"
      }

    );


  if (!response.ok) {

    throw new Error(
      "RSS取得失敗: " +
      response.status
    );

  }


  return await response.text();

}


/* =========================================================
   RSS解析
========================================================= */


function parseRSS(
  xmlText
) {


  const parser =
    new DOMParser();


  const xml =
    parser.parseFromString(
      xmlText,
      "application/xml"
    );


  const items =
    Array.from(
      xml.querySelectorAll(
        "item"
      )
    );


  return items

    .map(
      function(item) {


        const titleElement =
          item.querySelector(
            "title"
          );


        const pubDateElement =
          item.querySelector(
            "pubDate"
          );


        const enclosure =
          item.querySelector(
            "enclosure"
          );


        /* エピソード番号 */

        const episodeElement =
          Array.from(
            item.children
          ).find(
            function(el) {

              return (
                el.localName ===
                "episode"
              );

            }
          );


        /* シーズン */

        const seasonElement =
          Array.from(
            item.children
          ).find(
            function(el) {

              return (
                el.localName ===
                "season"
              );

            }
          );


        return {


          title:

            titleElement

              ? titleElement.textContent.trim()

              : "タイトル不明",


          pubDate:

            pubDateElement

              ? pubDateElement.textContent.trim()

              : "",


          audioURL:

            enclosure

              ? enclosure.getAttribute(
                  "url"
                )

              : "",


          episode:

            episodeElement

              ? episodeElement.textContent.trim()

              : "",


          season:

            seasonElement

              ? seasonElement.textContent.trim()

              : ""

        };


      }
    )


    .filter(
      function(item) {

        return item.audioURL;

      }
    );

}


/* =========================================================
   古い順
========================================================= */


function sortOldestFirst(
  list
) {


  return list.sort(
    function(a, b) {


      const dateA =
        new Date(
          a.pubDate
        ).getTime();


      const dateB =
        new Date(
          b.pubDate
        ).getTime();


      return (
        dateA - dateB
      );


    }
  );

}


/* =========================================================
   シーズン一覧作成
========================================================= */


function createSeasonList() {


  seasonSelect.innerHTML =

    '<option value="all">' +

    'すべてのシーズン' +

    '</option>';


  const seasons = [];


  episodes.forEach(
    function(episode) {


      if (

        episode.season &&

        !seasons.includes(
          episode.season
        )

      ) {


        seasons.push(
          episode.season
        );


      }


    }
  );


  seasons.sort(
    function(a, b) {


      return (

        Number(a) -

        Number(b)

      );


    }
  );


  seasons.forEach(
    function(season) {


      const option =
        document.createElement(
          "option"
        );


      option.value =
        season;


      option.textContent =
        "Season " +
        season;


      seasonSelect.appendChild(
        option
      );


    }
  );

}


/* =========================================================
   日付
========================================================= */


function formatDate(
  dateString
) {


  const date =
    new Date(
      dateString
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  return date.toLocaleDateString(
    "ja-JP",
    {

      year: "numeric",

      month: "2-digit",

      day: "2-digit"

    }
  );

}


/* =========================================================
   エピソード番号
========================================================= */


function getEpisodeLabel(
  episode,
  index
) {


  if (
    episode.episode
  ) {


    return (

      "第" +

      episode.episode +

      "回"

    );

  }


  return (

    "第" +

    (index + 1) +

    "回"

  );

}


/* =========================================================
   10秒戻る
========================================================= */


back10.addEventListener(
  "click",
  function() {


    audio.currentTime =

      Math.max(

        0,

        audio.currentTime - 10

      );


  }
);


/* =========================================================
   10秒進む
========================================================= */


forward10.addEventListener(
  "click",
  function() {


    if (
      audio.duration
    ) {


      audio.currentTime =

        Math.min(

          audio.duration,

          audio.currentTime + 10

        );


    }


  }
);


/* =========================================================
   エピソード再生
========================================================= */


function playEpisode(
  index
) {


  if (

    index < 0 ||

    index >= episodes.length

  ) {

    return;

  }


  const episode =
    episodes[index];


  currentIndex =
    index;


  audio.src =
    episode.audioURL;


  audio.load();


  audio.play().catch(
    function() {}
  );


  nowPlaying.textContent =

    getEpisodeLabel(
      episode,
      index
    )

    +

    "　"

    +

    episode.title;


  /*
   * Podcastごとに最後のエピソードを保存
   */

  localStorage.setItem(

    getStorageKey(),

    String(index)

  );


  renderEpisodes();

}


/* =========================================================
   フィルター
========================================================= */


function applyFilters() {


  const keyword =
    search.value
      .trim()
      .toLowerCase();


  filteredEpisodes =

    episodes.filter(
      function(episode) {


        const seasonOK =

          selectedSeason ===
          "all"

          ||

          episode.season ===
          selectedSeason;


        const searchOK =

          !keyword

          ||

          episode.title
            .toLowerCase()
            .includes(
              keyword
            );


        return (

          seasonOK &&

          searchOK

        );


      }
    );


  currentPage = 1;


  episodeCount.textContent =

    filteredEpisodes.length +

    " エピソード";


  renderEpisodes();

}


/* =========================================================
   シーズン変更
========================================================= */


seasonSelect.addEventListener(
  "change",
  function() {


    selectedSeason =
      seasonSelect.value;


    applyFilters();

  }
);


/* =========================================================
   検索
========================================================= */


search.addEventListener(
  "input",
  function() {


    applyFilters();

  }
);


/* =========================================================
   エピソード一覧
========================================================= */


function renderEpisodes() {


  const start =

    (currentPage - 1)

    *

    PER_PAGE;


  const end =

    start +

    PER_PAGE;


  const pageItems =

    filteredEpisodes.slice(
      start,
      end
    );


  episodesElement.innerHTML =
    "";


  if (
    pageItems.length === 0
  ) {


    episodesElement.innerHTML =

      '<div class="loading">' +

      '該当するエピソードがありません' +

      '</div>';


    pageInfo.textContent =
      "";


    return;

  }


  pageItems.forEach(
    function(episode) {


      const realIndex =

        episodes.indexOf(
          episode
        );


      const div =

        document.createElement(
          "div"
        );


      div.className =

        "episode"

        +

        (

          realIndex ===
          currentIndex

            ? " active"

            : ""

        );


      const number =

        document.createElement(
          "div"
        );


      number.className =
        "episode-number";


      number.textContent =

        getEpisodeLabel(
          episode,
          realIndex
        );


      const episodeTitle =

        document.createElement(
          "div"
        );


      episodeTitle.className =
        "episode-title";


      episodeTitle.textContent =
        episode.title;


      const date =

        document.createElement(
          "div"
        );


      date.className =
        "episode-date";


      date.textContent =

        formatDate(
          episode.pubDate
        );


      div.appendChild(
        number
      );


      div.appendChild(
        episodeTitle
      );


      div.appendChild(
        date
      );


      div.addEventListener(
        "click",
        function() {


          playEpisode(
            realIndex
          );


        }
      );


      episodesElement.appendChild(
        div
      );


    }
  );


  const totalPages =

    Math.max(

      1,

      Math.ceil(

        filteredEpisodes.length /

        PER_PAGE

      )

    );


  pageInfo.textContent =

    currentPage +

    " / " +

    totalPages;


  prevPage.disabled =

    currentPage <= 1;


  nextPage.disabled =

    currentPage >=
    totalPages;

}


/* =========================================================
   前の回
========================================================= */


prevButton.addEventListener(
  "click",
  function() {


    playEpisode(
      currentIndex - 1
    );


  }
);


/* =========================================================
   次の回
========================================================= */


nextButton.addEventListener(
  "click",
  function() {


    playEpisode(
      currentIndex + 1
    );


  }
);


/* =========================================================
   再生終了 → 次の回
========================================================= */


audio.addEventListener(
  "ended",
  function() {


    if (

      currentIndex <

      episodes.length - 1

    ) {


      playEpisode(

        currentIndex + 1

      );


    }


  }
);


/* =========================================================
   前ページ
========================================================= */


prevPage.addEventListener(
  "click",
  function() {


    if (
      currentPage > 1
    ) {


      currentPage--;


      renderEpisodes();


    }


  }
);


/* =========================================================
   次ページ
========================================================= */


nextPage.addEventListener(
  "click",
  function() {


    const totalPages =

      Math.ceil(

        filteredEpisodes.length /

        PER_PAGE

      );


    if (

      currentPage <

      totalPages

    ) {


      currentPage++;


      renderEpisodes();


    }


  }
);


/* =========================================================
   Podcast切り替え
========================================================= */


podcastSelect.addEventListener(
  "change",
  async function() {


    currentPodcast =
      podcastSelect.value;


    localStorage.setItem(

      "selectedPodcast",

      currentPodcast

    );


    /*
     * 状態リセット
     */

    episodes = [];

    filteredEpisodes = [];

    currentIndex = -1;

    currentPage = 1;

    selectedSeason = "all";


    /*
     * 検索欄をクリア
     */

    search.value = "";


    /*
     * シーズンを初期化
     */

    seasonSelect.innerHTML =

      '<option value="all">' +

      'すべてのシーズン' +

      '</option>';


    /*
     * ローディング表示
     */

    episodesElement.innerHTML =

      '<div class="loading">' +

      'エピソードを読み込んでいます……' +

      '</div>';


    episodeCount.textContent =
      "";


    pageInfo.textContent =
      "";


    /*
     * プレイヤー停止
     */

    audio.pause();


    audio.removeAttribute(
      "src"
    );


    audio.load();


    nowPlaying.textContent =
      "読み込み中……";


    /*
     * Podcast読み込み
     */

    await loadPodcast();

  }
);


/* =========================================================
   Podcast読み込み
========================================================= */


async function loadPodcast() {


  try {


    const xmlText =
      await fetchRSS();


    episodes =
      parseRSS(
        xmlText
      );


    episodes =
      sortOldestFirst(
        episodes
      );


    /*
     * シーズン作成
     */

    createSeasonList();


    /*
     * 全エピソード
     */

    filteredEpisodes =
      episodes.slice();


    episodeCount.textContent =

      episodes.length +

      " エピソード";


    /*
     * 前回再生したエピソード
     */

    const savedIndex =

      parseInt(

        localStorage.getItem(
          getStorageKey()
        ),

        10

      );


    if (

      !isNaN(savedIndex) &&

      savedIndex >= 0 &&

      savedIndex < episodes.length

    ) {


      currentIndex =
        savedIndex;


      const episode =
        episodes[savedIndex];


      audio.src =
        episode.audioURL;


      nowPlaying.textContent =

        getEpisodeLabel(
          episode,
          savedIndex
        )

        +

        "　"

        +

        episode.title;


      currentPage =

        Math.floor(

          savedIndex /

          PER_PAGE

        ) + 1;


    } else {


      /*
       * まだ聴いていない場合
       * 最初のエピソードを表示
       */

      if (
        episodes.length > 0
      ) {


        const episode =
          episodes[0];


        currentIndex = 0;


        audio.src =
          episode.audioURL;


        nowPlaying.textContent =

          getEpisodeLabel(
            episode,
            0
          )

          +

          "　"

          +

          episode.title;


      }


    }


    renderEpisodes();


  } catch(error) {


    console.error(
      error
    );


    episodesElement.innerHTML =

      '<div class="error">' +

      'PodcastのRSSを取得できませんでした。' +

      '<br><br>' +

      error.message +

      '</div>';


    nowPlaying.textContent =

      "読み込みに失敗しました";


  }

}


/* =========================================================
   初期化
========================================================= */


async function init() {


  /*
   * 保存されているPodcastを復元
   */

  const savedPodcast =

    localStorage.getItem(
      "selectedPodcast"
    );


  if (

    savedPodcast &&

    PODCASTS[savedPodcast]

  ) {


    currentPodcast =
      savedPodcast;


    podcastSelect.value =
      savedPodcast;


  }


  /*
   * 初回読み込み
   */

  await loadPodcast();

}


init();


</script>
